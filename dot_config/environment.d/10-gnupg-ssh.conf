# Point SSH_AUTH_SOCK at the gpg-agent ssh-agent-emulation socket for the
# whole systemd user session (shells, GUI apps, anything launched by the
# compositor), not just interactive shells.
#
# gpg-agent's ssh socket is already brought up by socket activation
# (gpg-agent-ssh.socket), so nothing needs to launch the agent here -
# it starts on first connection.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent.ssh
