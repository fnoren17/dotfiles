# One session per project in ~/dev, managed by ~/.local/bin/nvim-dev

# Colours + undercurls in alacritty
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB:usstyle"

# Neovim needs these: no Esc delay, and focus events so garbage-day.nvim
# can stop LSP servers in sessions you're not looking at
set -sg escape-time 0
set -g focus-events on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Killing a session switches to another one instead of closing the window
set -g detach-on-destroy off

# Window title "dev: <project>" (shown in Hyprland / noctalia)
set -g set-titles on
set -g set-titles-string "dev: #S"

# Project picker / session switching
bind f display-popup -E -w 60% -h 60% "nvim-dev pick"
bind -n M-p display-popup -E -w 60% -h 60% "nvim-dev pick"
bind s choose-tree -Zs
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# Splits and new windows open in the project directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Minimal status line
set -g status-position bottom
set -g status-style "bg=default,fg=#7aa2f7"
set -g status-left "#[bold] #S #[nobold]│ "
set -g status-left-length 40
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}%H:%M "
setw -g window-status-current-style "bold"
